name: Build DawnCraft Launcher for Windows
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer
        run: npm run dist
      - name: Upload EXE installer
        uses: actions/upload-artifact@v4
        with:
          name: DawnCraft-Launcher-Setup
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14